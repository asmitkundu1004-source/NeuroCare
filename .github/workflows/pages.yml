# Publishes the zero-server site to GitHub Pages on every push to main.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-fund --no-audit
      - run: npm run sync
      - name: Browser runtime matches the Python server
        run: npm test
      - name: Build for https://<user>.github.io/<repo>/
        run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}/
      # GitHub Pages has no rewrite rules; serving the app as 404.html makes deep links work.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
